name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # or master, depending on your default branch

# -------------------------------------------------------------
# ADD THIS BLOCK BELOW
# -------------------------------------------------------------
permissions:
  contents: read
  pages: write
  id-token: write
# -------------------------------------------------------------

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ... your build steps here (e.g., setup node, build site) ...

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # or your build output directory like './dist'

      name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4  # or v5